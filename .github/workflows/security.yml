name: Security and build checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete checkout history for secrets
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner --log-opts=--all

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
      - run: python -m compileall -q backend
      - name: Verify application startup and public route guards
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from fastapi.testclient import TestClient
          from backend.api import app
          with patch('backend.job_api.startup') as start, patch('backend.job_api.shutdown') as stop:
              with TestClient(app) as client:
                  assert client.get('/health').status_code == 200
                  start.assert_called_once_with()
                  for path in ('/logs', '/logs/download', '/cloud-links', '/cleanup/example.txt'):
                      assert client.get(path).status_code == 404
              stop.assert_called_once_with()
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run build
